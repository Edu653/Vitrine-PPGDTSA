<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Vitrine de Trabalhos — PPGDTSA • DCSA • UFPel</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: #0b1310;
      color: #0f172a;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }

    /* Em telas grandes (desktop/TV), exibe fundo ambiente desfocado e centraliza a tela vertical de celular */
    .outer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #0d1712;
      display: none;
    }

    .outer-backdrop-img {
      position: absolute;
      inset: -12%;
      width: 124%;
      height: 124%;
      background-size: cover;
      background-position: center;
      filter: blur(42px) saturate(1.3) brightness(0.48);
      transform: scale(1.08);
      transition: background-image 1s ease, opacity 1s ease;
    }

    .viewport-wrapper {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Palco principal da Vitrine (100% da tela no celular; moldura mobile elegante no desktop) */
    .phone-stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eef2ee;
      display: flex;
      flex-direction: column;
      cursor: grab;
      touch-action: none;
    }

    .phone-stage:active {
      cursor: grabbing;
    }

    @media (min-width: 541px) {
      .outer-backdrop {
        display: block;
      }
      .phone-stage {
        width: min(430px, 92vw);
        height: min(860px, 94dvh);
        border-radius: 38px;
        border: 3px solid rgba(255, 255, 255, 0.28);
        box-shadow:
          0 28px 70px rgba(0, 0, 0, 0.58),
          0 0 0 1px rgba(0, 0, 0, 0.35);
      }
    }

    /* =========================================================================
       CAMADAS DE FUNDO DINÂMICO COM BLUR + ANIMAÇÃO SUTIL (KEN BURNS + DRIFT)
       ========================================================================= */
    .bg-canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-photo-layer {
      position: absolute;
      inset: -10%;
      width: 120%;
      height: 120%;
      background-size: cover;
      background-position: center;
      filter: blur(16px) saturate(1.38) contrast(1.04);
      opacity: 0;
      will-change: transform, opacity;
      transition: opacity 1.6s ease-in-out;
    }

    .bg-photo-layer.is-visible {
      opacity: 1;
    }

    .bg-photo-layer.anim-a {
      animation: subtleDriftA 15s ease-in-out infinite alternate;
    }

    .bg-photo-layer.anim-b {
      animation: subtleDriftB 17s ease-in-out infinite alternate;
    }

    @keyframes subtleDriftA {
      0%   { transform: scale(1.08) translate3d(-2.2%, -1.8%, 0) rotate(-0.6deg); }
      50%  { transform: scale(1.16) translate3d(1.5%, 1.2%, 0) rotate(0.4deg); }
      100% { transform: scale(1.22) translate3d(2.4%, -1.4%, 0) rotate(0.8deg); }
    }

    @keyframes subtleDriftB {
      0%   { transform: scale(1.20) translate3d(2.2%, 1.6%, 0) rotate(0.6deg); }
      50%  { transform: scale(1.13) translate3d(-1.6%, -0.8%, 0) rotate(-0.3deg); }
      100% { transform: scale(1.09) translate3d(-2.4%, 1.8%, 0) rotate(-0.7deg); }
    }

    /* Brilho orgânico flutuante muito sutil para dar vida e profundidade ao fundo */
    .bg-ambient-orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: soft-light;
      filter: blur(36px);
      will-change: transform;
    }

    .bg-ambient-orb.orb-1 {
      width: 78%;
      height: 46%;
      top: -6%;
      left: -14%;
      background: radial-gradient(circle, rgba(255, 252, 235, 0.72) 0%, rgba(255, 255, 255, 0) 72%);
      animation: orbFloat1 13s ease-in-out infinite alternate;
    }

    .bg-ambient-orb.orb-2 {
      width: 82%;
      height: 50%;
      bottom: -8%;
      right: -16%;
      background: radial-gradient(circle, rgba(225, 248, 232, 0.68) 0%, rgba(255, 255, 255, 0) 72%);
      animation: orbFloat2 16s ease-in-out infinite alternate;
    }

    @keyframes orbFloat1 {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(22%, 14%, 0) scale(1.14); }
    }

    @keyframes orbFloat2 {
      0%   { transform: translate3d(0, 0, 0) scale(1.08); }
      100% { transform: translate3d(-20%, -13%, 0) scale(0.95); }
    }

    /* Véu translúcido luminoso: preserva as cores e o movimento da foto desfocada
       enquanto garante leitura nítida dos logos e textos escuros da simulação */
    .bg-veil {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.74) 0%,
        rgba(255, 255, 255, 0.54) 36%,
        rgba(255, 255, 255, 0.56) 68%,
        rgba(255, 255, 255, 0.72) 100%
      );
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    /* =========================================================================
       BARRA DE PROGRESSO DE 12 SEGUNDOS + INDICADOR SUTIL DE PAUSA AO SEGURAR
       ========================================================================= */
    .top-progress-track {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(15, 23, 42, 0.12);
      z-index: 10;
      overflow: hidden;
    }

    .top-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #004a8f 0%, #15803d 100%);
      border-radius: 0 999px 999px 0;
      will-change: width;
    }

    .hold-badge {
      position: absolute;
      top: 10px;
      right: 14px;
      z-index: 12;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.68);
      color: #ffffff;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }

    .phone-stage.is-holding .hold-badge {
      opacity: 1;
      transform: translateY(0);
    }

    /* =========================================================================
       ESTRUTURA VERTICAL FIEL AO MODELO DO CELULAR
       ========================================================================= */
    .vitrine-shell {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      padding:
        calc(env(safe-area-inset-top, 0px) + clamp(18px, 3.4dvh, 32px))
        clamp(20px, 6vw, 30px)
        calc(env(safe-area-inset-bottom, 0px) + clamp(20px, 3.8dvh, 34px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: clamp(10px, 1.8dvh, 18px);
    }

    /* 1. Cabeçalho Institucional: UFPel • DCSA • PPGDTSA */
    .logos-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 5.5vw, 28px);
      flex-shrink: 0;
      padding-top: 2px;
    }

    .logo-item {
      object-fit: contain;
      filter:
        drop-shadow(0 2px 6px rgba(255, 255, 255, 0.85))
        drop-shadow(0 2px 5px rgba(15, 23, 42, 0.14));
      pointer-events: none;
    }

    .logo-ufpel {
      height: clamp(54px, 8.8dvh, 76px);
      width: auto;
    }

    .logo-dcsa {
      height: clamp(46px, 7.6dvh, 66px);
      width: auto;
    }

    .logo-ppgdtsa {
      height: clamp(56px, 9.2dvh, 78px);
      width: auto;
    }

    /* Área deslizável do trabalho (Título/Subtítulo + Resumo + Autor/Ano) */
    .work-slide {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      padding: clamp(4px, 1.2dvh, 12px) 0;
      will-change: transform, opacity;
    }

    .work-slide.is-snapping {
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
    }

    /* 2. Título e Subtítulo */
    .title-group {
      width: 100%;
      max-width: 36ch;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(4px, 0.9dvh, 8px);
    }

    .work-title {
      font-weight: 800;
      color: #0b111e;
      line-height: 1.2;
      letter-spacing: -0.015em;
      text-wrap: balance;
      text-shadow:
        0 1px 14px rgba(255, 255, 255, 0.95),
        0 0 3px rgba(255, 255, 255, 0.95);
    }

    .work-title.size-lg {
      font-size: clamp(1.35rem, 5.4vw, 1.72rem);
    }

    .work-title.size-md {
      font-size: clamp(1.16rem, 4.6vw, 1.44rem);
    }

    .work-title.size-sm {
      font-size: clamp(1.02rem, 4.0vw, 1.24rem);
    }

    .work-subtitle {
      font-weight: 400;
      color: #162032;
      font-size: clamp(0.96rem, 3.9vw, 1.18rem);
      line-height: 1.28;
      max-width: 34ch;
      text-wrap: balance;
      text-shadow:
        0 1px 12px rgba(255, 255, 255, 0.95),
        0 0 3px rgba(255, 255, 255, 0.92);
    }

    .work-subtitle:empty {
      display: none;
    }

    /* 3. Resumo centralizado */
    .resumo-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(6px, 1.5dvh, 16px) 2px;
    }

    .work-resumo {
      font-weight: 700;
      color: #0f172a;
      font-size: clamp(1.06rem, 4.35vw, 1.28rem);
      line-height: 1.46;
      max-width: 30ch;
      text-wrap: balance;
      text-shadow:
        0 1px 16px rgba(255, 255, 255, 0.96),
        0 0 4px rgba(255, 255, 255, 0.95);
    }

    /* 4. Nome do autor + Ano */
    .author-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding-bottom: clamp(2px, 0.6dvh, 6px);
    }

    .work-author {
      font-weight: 700;
      color: #0b111e;
      font-size: clamp(1.02rem, 4.1vw, 1.2rem);
      line-height: 1.25;
      text-shadow:
        0 1px 12px rgba(255, 255, 255, 0.95),
        0 0 3px rgba(255, 255, 255, 0.95);
    }

    .work-year {
      font-weight: 700;
      color: #0b111e;
      font-size: clamp(1.0rem, 4.0vw, 1.16rem);
      line-height: 1.2;
      text-shadow:
        0 1px 12px rgba(255, 255, 255, 0.95),
        0 0 3px rgba(255, 255, 255, 0.95);
    }

    /* 5. Botão de Acesso Direto ao Trabalho no Guaiaca/UFPel */
    .cta-footer {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: clamp(168px, 48vw, 206px);
      padding: clamp(13px, 2.1dvh, 16px) clamp(28px, 8vw, 38px);
      background: linear-gradient(180deg, #0756a8 0%, #004388 100%);
      color: #ffffff;
      font-size: clamp(1.02rem, 4.1vw, 1.18rem);
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 18px;
      box-shadow:
        0 8px 22px rgba(0, 67, 136, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
      cursor: pointer;
      touch-action: manipulation;
    }

    .cta-btn:hover {
      background: linear-gradient(180deg, #0a62bd 0%, #024c99 100%);
      box-shadow:
        0 10px 26px rgba(0, 67, 136, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.34);
    }

    .cta-btn:active {
      transform: scale(0.96);
    }

    /* Ajustes finos para celulares de tela mais baixa (ex.: iPhone SE / janelas compactas) */
    @media (max-height: 660px) {
      .logo-ufpel { height: 46px; }
      .logo-dcsa { height: 40px; }
      .logo-ppgdtsa { height: 48px; }
      .work-title.size-lg { font-size: 1.2rem; }
      .work-title.size-md { font-size: 1.06rem; }
      .work-title.size-sm { font-size: 0.96rem; }
      .work-subtitle { font-size: 0.9rem; }
      .work-resumo { font-size: 0.98rem; line-height: 1.38; }
      .work-author, .work-year { font-size: 0.94rem; }
      .cta-btn { padding: 11px 26px; font-size: 0.96rem; border-radius: 15px; }
    }
  </style>
</head>
<body>
  <!-- Fundo estendido para telas desktop/monitores -->
  <div class="outer-backdrop" aria-hidden="true">
    <div class="outer-backdrop-img" id="outerBackdropImg"></div>
  </div>

  <main class="viewport-wrapper">
    <section class="phone-stage" id="phoneStage" aria-label="Vitrine de Trabalhos do PPGDTSA">
      <!-- Barra superior de tempo (12s) -->
      <div class="top-progress-track" aria-hidden="true">
        <div class="top-progress-fill" id="progressFill"></div>
      </div>
      <div class="hold-badge" id="holdBadge">Pausado</div>

      <!-- Camadas de fundo desfocadas e animadas sutilmente -->
      <div class="bg-canvas" aria-hidden="true">
        <div class="bg-photo-layer anim-a" id="bgLayer0"></div>
        <div class="bg-photo-layer anim-b" id="bgLayer1"></div>
        <div class="bg-ambient-orb orb-1"></div>
        <div class="bg-ambient-orb orb-2"></div>
        <div class="bg-veil"></div>
      </div>

      <!-- Conteúdo principal da Vitrine -->
      <div class="vitrine-shell">
        <header class="logos-header">
          <img src="./src/assets/ufpel_logo.png" alt="UFPel" class="logo-item logo-ufpel" draggable="false" />
          <img src="./src/assets/vitrine/logos/dcsa_logo.png" alt="DCSA" class="logo-item logo-dcsa" draggable="false" />
          <img src="./src/assets/vitrine/logos/ppgdtsa_tree.png" alt="PPGDTSA" class="logo-item logo-ppgdtsa" draggable="false" />
        </header>

        <article class="work-slide is-snapping" id="workSlide" aria-live="polite">
          <div class="title-group">
            <h1 class="work-title size-md" id="workTitle"></h1>
            <p class="work-subtitle" id="workSubtitle"></p>
          </div>

          <div class="resumo-wrapper">
            <p class="work-resumo" id="workResumo"></p>
          </div>

          <div class="author-group">
            <div class="work-author" id="workAuthor"></div>
            <div class="work-year" id="workYear"></div>
          </div>
        </article>

        <footer class="cta-footer">
          <a
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="cta-btn"
            id="workLink"
          >ACESSE JÁ</a>
        </footer>
      </div>
    </section>
  </main>

  <script src="./src/data/vitrineTrabalhos.js"></script>
  <script>
    (() => {
      const SLIDE_DURATION_MS = 12000;
      const SWIPE_DISTANCE_PX = 46;
      const SWIPE_FLICK_PX = 24;
      const SWIPE_VELOCITY_PX_MS = 0.28;

      const rawWorks = Array.isArray(window.VITRINE_TRABALHOS) ? window.VITRINE_TRABALHOS : [];
      if (!rawWorks.length) return;

      // Embaralhamento Fisher-Yates exclusivo para cada visitante/acesso
      function shuffleWorks(list) {
        const copy = list.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const randBuf = new Uint32Array(1);
          if (window.crypto && window.crypto.getRandomValues) {
            window.crypto.getRandomValues(randBuf);
            const j = randBuf[0] % (i + 1);
            [copy[i], copy[j]] = [copy[j], copy[i]];
          } else {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
          }
        }
        return copy;
      }

      const deck = shuffleWorks(rawWorks);
      let currentIndex = 0;

      // Elementos do DOM
      const stageEl = document.getElementById('phoneStage');
      const slideEl = document.getElementById('workSlide');
      const titleEl = document.getElementById('workTitle');
      const subtitleEl = document.getElementById('workSubtitle');
      const resumoEl = document.getElementById('workResumo');
      const authorEl = document.getElementById('workAuthor');
      const yearEl = document.getElementById('workYear');
      const linkEl = document.getElementById('workLink');
      const progressFillEl = document.getElementById('progressFill');
      const outerBackdropImgEl = document.getElementById('outerBackdropImg');
      const bgLayers = [
        document.getElementById('bgLayer0'),
        document.getElementById('bgLayer1')
      ];
      let activeBgIdx = 0;
      let currentSubPhotoIdx = 0;
      let lastCrossfadeStep = 0;

      // Pré-carregamento silencioso das imagens vizinhas (próximo e anterior)
      const preloadedUrls = new Set();
      function preloadImagesForIndex(idx) {
        const wrapped = ((idx % deck.length) + deck.length) % deck.length;
        const item = deck[wrapped];
        if (!item || !Array.isArray(item.imagens)) return;
        for (const src of item.imagens) {
          if (!preloadedUrls.has(src)) {
            preloadedUrls.add(src);
            const img = new Image();
            img.src = src;
          }
        }
      }

      // Alterna suavemente a imagem desfocada de fundo
      function setBackgroundImage(src) {
        if (!src) return;
        const nextBgIdx = 1 - activeBgIdx;
        const nextLayer = bgLayers[nextBgIdx];
        const prevLayer = bgLayers[activeBgIdx];

        nextLayer.style.backgroundImage = `url("${src}")`;
        nextLayer.classList.add('is-visible');
        prevLayer.classList.remove('is-visible');
        activeBgIdx = nextBgIdx;

        if (outerBackdropImgEl) {
          outerBackdropImgEl.style.backgroundImage = `url("${src}")`;
        }
      }

      // Ajusta classe tipográfica do título conforme extensão para equilíbrio visual
      function applyTitleSizing(titleText, subtitleText) {
        const totalWeight = titleText.length + (subtitleText ? subtitleText.length * 0.65 : 0);
        titleEl.classList.remove('size-lg', 'size-md', 'size-sm');
        if (totalWeight <= 55) {
          titleEl.classList.add('size-lg');
        } else if (totalWeight <= 115) {
          titleEl.classList.add('size-md');
        } else {
          titleEl.classList.add('size-sm');
        }
      }

      function populateWorkContent(item) {
        const hasSub = Boolean(item.subtitulo && item.subtitulo.trim());
        const cleanTitle = (item.titulo || '').trim().replace(/:+$/, '');
        const displayTitle = hasSub ? `${cleanTitle}:` : cleanTitle;
        const displaySub = hasSub ? item.subtitulo.trim() : '';

        applyTitleSizing(displayTitle, displaySub);
        titleEl.textContent = displayTitle;
        subtitleEl.textContent = displaySub;
        resumoEl.textContent = item.resumo || '';
        authorEl.textContent = item.autor || '';
        yearEl.textContent = String(item.ano || '');
        linkEl.href = item.link || '#';

        currentSubPhotoIdx = 0;
        lastCrossfadeStep = 0;
        if (Array.isArray(item.imagens) && item.imagens.length > 0) {
          setBackgroundImage(item.imagens[0]);
        }

        preloadImagesForIndex(currentIndex + 1);
        preloadImagesForIndex(currentIndex - 1);
      }

      // Controle de tempo contínuo (12s) com suporte a pausa exata ao segurar o toque/clique
      let elapsedMs = 0;
      let lastFrameTime = performance.now();
      let isHolding = false;
      let isTransitioning = false;
      let isTabHidden = document.hidden;

      function goToSlide(targetIdx, direction = 'next') {
        if (isTransitioning) return;
        isTransitioning = true;

        const nextIndex = ((targetIdx % deck.length) + deck.length) % deck.length;
        const exitOffset = direction === 'next' ? -72 : 72;
        const enterOffset = direction === 'next' ? 72 : -72;

        slideEl.classList.add('is-snapping');
        slideEl.style.transform = `translate3d(${exitOffset}px, 0, 0)`;
        slideEl.style.opacity = '0';

        setTimeout(() => {
          currentIndex = nextIndex;
          elapsedMs = 0;
          progressFillEl.style.width = '0%';

          slideEl.classList.remove('is-snapping');
          slideEl.style.transform = `translate3d(${enterOffset}px, 0, 0)`;
          populateWorkContent(deck[currentIndex]);

          // Força reflow para animar entrada suave
          void slideEl.offsetWidth;
          slideEl.classList.add('is-snapping');
          slideEl.style.transform = 'translate3d(0, 0, 0)';
          slideEl.style.opacity = '1';

          setTimeout(() => {
            isTransitioning = false;
            lastFrameTime = performance.now();
          }, 320);
        }, 220);
      }

      function tick(now) {
        const dt = Math.min(100, Math.max(0, now - lastFrameTime));
        lastFrameTime = now;

        if (!isHolding && !isTransitioning && !isTabHidden) {
          elapsedMs += dt;
          const pct = Math.min(100, (elapsedMs / SLIDE_DURATION_MS) * 100);
          progressFillEl.style.width = `${pct.toFixed(2)}%`;

          // Se o card tiver mais de 1 foto (ex.: as 2 ou 3 fotos reais do trabalho),
          // faz uma transição suave de fundo ao longo dos 12 segundos
          const currentItem = deck[currentIndex];
          if (currentItem && Array.isArray(currentItem.imagens) && currentItem.imagens.length > 1) {
            const totalImgs = currentItem.imagens.length;
            const stepDuration = SLIDE_DURATION_MS / totalImgs;
            const targetStep = Math.min(totalImgs - 1, Math.floor(elapsedMs / stepDuration));
            if (targetStep !== lastCrossfadeStep) {
              lastCrossfadeStep = targetStep;
              currentSubPhotoIdx = targetStep;
              setBackgroundImage(currentItem.imagens[currentSubPhotoIdx]);
            }
          }

          if (elapsedMs >= SLIDE_DURATION_MS) {
            goToSlide(currentIndex + 1, 'next');
          }
        }

        requestAnimationFrame(tick);
      }

      // =======================================================================
      // GESTOS DE TOQUE E MOUSE:
      // - Segurar o clique/toque: pausa a passagem automática
      // - Arrastar para esquerda/direita: avança para o próximo ou volta ao anterior
      // =======================================================================
      let activePointerId = null;
      let startX = 0;
      let startY = 0;
      let currentDx = 0;
      let dragStartTime = 0;
      let isHorizontalDrag = false;

      function isInteractiveLink(target) {
        return Boolean(target && target.closest && target.closest('.cta-btn'));
      }

      stageEl.addEventListener('contextmenu', (e) => {
        if (!isInteractiveLink(e.target)) {
          e.preventDefault();
        }
      });

      stageEl.addEventListener('pointerdown', (e) => {
        if (isInteractiveLink(e.target)) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (activePointerId !== null || isTransitioning) return;

        activePointerId = e.pointerId;
        startX = e.clientX;
        startY = e.clientY;
        currentDx = 0;
        dragStartTime = performance.now();
        isHorizontalDrag = false;

        isHolding = true;
        stageEl.classList.add('is-holding');
        slideEl.classList.remove('is-snapping');

        if (stageEl.setPointerCapture) {
          try { stageEl.setPointerCapture(e.pointerId); } catch (_) {}
        }
      });

      stageEl.addEventListener('pointermove', (e) => {
        if (e.pointerId !== activePointerId || isTransitioning) return;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        if (!isHorizontalDrag && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
          isHorizontalDrag = true;
        }

        if (isHorizontalDrag) {
          currentDx = dx;
          const damped = dx * 0.58;
          const fade = Math.max(0.45, 1 - Math.abs(dx) / 360);
          slideEl.style.transform = `translate3d(${damped.toFixed(1)}px, 0, 0)`;
          slideEl.style.opacity = fade.toFixed(3);
        }
      });

      function endPointerGesture(e, cancelled = false) {
        if (e.pointerId !== activePointerId) return;

        if (stageEl.releasePointerCapture) {
          try { stageEl.releasePointerCapture(e.pointerId); } catch (_) {}
        }

        const totalTime = Math.max(1, performance.now() - dragStartTime);
        const velocity = currentDx / totalTime;
        const dx = currentDx;

        activePointerId = null;
        isHolding = false;
        stageEl.classList.remove('is-holding');

        if (!cancelled && isHorizontalDrag) {
          const swipedNext = dx <= -SWIPE_DISTANCE_PX || (dx <= -SWIPE_FLICK_PX && velocity <= -SWIPE_VELOCITY_PX_MS);
          const swipedPrev = dx >= SWIPE_DISTANCE_PX || (dx >= SWIPE_FLICK_PX && velocity >= SWIPE_VELOCITY_PX_MS);

          if (swipedNext) {
            goToSlide(currentIndex + 1, 'next');
            return;
          }
          if (swipedPrev) {
            goToSlide(currentIndex - 1, 'prev');
            return;
          }
        }

        // Se apenas segurou para ler (ou arrastou pouco), retorna suavemente ao centro e retoma o tempo
        slideEl.classList.add('is-snapping');
        slideEl.style.transform = 'translate3d(0, 0, 0)';
        slideEl.style.opacity = '1';
        lastFrameTime = performance.now();
      }

      stageEl.addEventListener('pointerup', (e) => endPointerGesture(e, false));
      stageEl.addEventListener('pointercancel', (e) => endPointerGesture(e, true));

      // Suporte complementar a teclado para testes no computador (Setas e Espaço)
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') {
          goToSlide(currentIndex + 1, 'next');
        } else if (e.key === 'ArrowLeft') {
          goToSlide(currentIndex - 1, 'prev');
        } else if (e.key === ' ' && !e.repeat) {
          e.preventDefault();
          isHolding = true;
          stageEl.classList.add('is-holding');
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === ' ') {
          isHolding = false;
          stageEl.classList.remove('is-holding');
          lastFrameTime = performance.now();
        }
      });

      document.addEventListener('visibilitychange', () => {
        isTabHidden = document.hidden;
        lastFrameTime = performance.now();
      });

      // Inicialização imediata no primeiro trabalho aleatório
      populateWorkContent(deck[currentIndex]);
      lastFrameTime = performance.now();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
